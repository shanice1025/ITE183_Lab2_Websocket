
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTalk</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">

  <style>
    :root {
      --sage: #879b80;
      --sage-dark: #657a60;
      --sage-light: #dce5d7;
      --cream: #faf8f0;
      --white: #ffffff;
      --text: #394438;
      --muted: #7b8577;
      --border: #e2e7dc;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: var(--cream);
      color: var(--text);
      font-family: 'Montserrat', sans-serif;
    }

    .app {
      width: 100%;
      max-width: 760px;
      height: min(820px, calc(100vh - 56px));
      min-height: 520px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--white);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(75, 94, 69, 0.10);
    }

    .chat-header {
      flex-shrink: 0;
      padding: 24px 20px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background: var(--sage-light);
      border-bottom: 1px solid var(--border);
    }

    .header-bunny {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 8px;
    }

    .header-bunny svg {
      width: 68px;
      height: 68px;
    }

    .chat-header h1 {
      margin: 0;
      color: var(--sage-dark);
      font-family: 'Pacifico', cursive;
      font-size: 38px;
      font-weight: 400;
      line-height: 1.35;
    }

    .chat-header p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .status-bar {
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      padding: 11px;
      background: #fffefb;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
      font-size: 12px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #c5a36b;
    }

    .status-dot.connected {
      background: #6d9b68;
    }

    .status-dot.disconnected {
      background: #c96f68;
    }

    .messages {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px;
      padding: 24px;
      background: #fffefb;
    }

    .message {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      align-self: flex-start;
      max-width: 90%;
      animation: appear 0.2s ease-out;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .sender-name {
      padding-left: 4px;
      margin-bottom: 5px;
      color: var(--sage-dark);
      font-size: 12px;
      font-weight: 700;
    }

    .message-bubble {
      padding: 12px 15px;
      overflow-wrap: anywhere;
      border-radius: 16px 16px 16px 4px;
      background: #edf2e9;
      color: var(--text);
      font-size: 14px;
      line-height: 1.55;
    }

    .message-time {
      padding-left: 4px;
      margin-top: 5px;
      color: #9aa194;
      font-size: 10px;
    }

    .composer {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 18px;
      background: var(--white);
      border-top: 1px solid var(--border);
    }

    .composer input {
      flex: 1;
      min-width: 0;
      padding: 14px 17px;
      outline: none;
      border: 1px solid var(--border);
      border-radius: 25px;
      background: #fafbf7;
      color: var(--text);
      font-family: inherit;
      font-size: 14px;
      transition: border-color 0.2s;
    }

    .composer input:focus {
      border-color: var(--sage);
    }

    .composer input::placeholder {
      color: #a0a89a;
    }

    .send-button {
      flex-shrink: 0;
      padding: 13px 22px;
      border: none;
      border-radius: 25px;
      background: var(--sage);
      color: white;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    .send-button:hover {
      background: var(--sage-dark);
    }

    .send-button:active {
      transform: scale(0.97);
    }

    .send-button:disabled {
      cursor: not-allowed;
      opacity: 0.55;
    }

    @media (max-width: 600px) {
      body {
        padding: 0;
      }

      .app {
        width: 100%;
        height: 100dvh;
        min-height: 0;
        border: none;
        border-radius: 0;
      }

      .chat-header {
        padding: 18px 16px;
      }

      .header-bunny svg {
        width: 56px;
        height: 56px;
      }

      .chat-header h1 {
        font-size: 32px;
      }

      .messages {
        padding: 18px 12px;
      }

      .message {
        max-width: 96%;
      }

      .composer {
        padding: 12px;
      }

      .send-button {
        padding: 13px 17px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="chat-header">
      <div class="header-bunny">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bunny">
          <ellipse cx="37" cy="27" rx="12" ry="25" transform="rotate(-15 37 27)" fill="#fffdf5" stroke="#879b80" stroke-width="3"/>
          <ellipse cx="63" cy="27" rx="12" ry="25" transform="rotate(15 63 27)" fill="#fffdf5" stroke="#879b80" stroke-width="3"/>
          <ellipse cx="37" cy="27" rx="5" ry="16" transform="rotate(-15 37 27)" fill="#e9b9b7"/>
          <ellipse cx="63" cy="27" rx="5" ry="16" transform="rotate(15 63 27)" fill="#e9b9b7"/>
          <circle cx="50" cy="57" r="30" fill="#fffdf5" stroke="#879b80" stroke-width="3"/>
          <circle cx="40" cy="54" r="3" fill="#394438"/>
          <circle cx="60" cy="54" r="3" fill="#394438"/>
          <ellipse cx="32" cy="63" rx="6" ry="4" fill="#efc5bf"/>
          <ellipse cx="68" cy="63" rx="6" ry="4" fill="#efc5bf"/>
          <path d="M46 62 Q50 67 54 62" fill="none" stroke="#394438" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M50 66 L50 69" stroke="#394438" stroke-width="2" stroke-linecap="round"/>
          <path d="M42 72 Q50 79 58 72" fill="none" stroke="#394438" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>

      <h1>TikTalk</h1>
      <p>Let's talk!</p>
    </header>

    <div class="status-bar">
      <span class="status-dot" id="statusDot"></span>
      <span id="connectionStatus">Connecting...</span>
    </div>

    <section class="messages" id="messages" aria-live="polite"></section>

    <form class="composer" id="messageForm">
      <input
        type="text"
        id="messageInput"
        placeholder="Write a message..."
        autocomplete="off"
        maxlength="1000"
        aria-label="Your message"
      >
      <button class="send-button" id="sendButton" type="submit" disabled>Send</button>
    </form>
  </main>

  <script>
    const messages = document.getElementById("messages");
    const messageForm = document.getElementById("messageForm");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const connectionStatus = document.getElementById("connectionStatus");
    const statusDot = document.getElementById("statusDot");

    const socketUrl =
      (location.protocol === "https:" ? "wss://" : "ws://") +
      location.host;

    const socket = new WebSocket(socketUrl);

    // Assign a simple display name to each WebSocket client ID.
    const userNames = new Map();
    let nextUserNumber = 1;

    function getUserName(clientId) {
      if (!userNames.has(clientId)) {
        userNames.set(clientId, "User " + nextUserNumber);
        nextUserNumber++;
      }

      return userNames.get(clientId);
    }

    function updateConnectionStatus(status, className) {
      connectionStatus.textContent = status;
      statusDot.className = "status-dot " + className;
    }

    function addMessage(text) {
      // Ignore the server's automatic connection welcome message.
      if (text.trim() === "Welcome to WebSocket server!") {
        return;
      }

      const match = text.match(/^User\s+(.+?)\s+says:\s*([\s\S]*)$/);

      let displayName = "User";
      let messageText = text;

      if (match) {
        displayName = getUserName(match[1]);
        messageText = match[2];
      }

      const messageElement = document.createElement("div");
      messageElement.className = "message";

      const senderElement = document.createElement("div");
      senderElement.className = "sender-name";
      senderElement.textContent = displayName;

      const bubble = document.createElement("div");
      bubble.className = "message-bubble";
      bubble.textContent = messageText;

      const time = document.createElement("div");
      time.className = "message-time";
      time.textContent = new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
      });

      messageElement.appendChild(senderElement);
      messageElement.appendChild(bubble);
      messageElement.appendChild(time);

      messages.appendChild(messageElement);
      messages.scrollTop = messages.scrollHeight;
    }

    socket.addEventListener("open", () => {
      updateConnectionStatus("Connected", "connected");
      sendButton.disabled = false;
      messageInput.focus();
    });

    socket.addEventListener("message", event => {
      addMessage(String(event.data));
    });

    socket.addEventListener("close", () => {
      updateConnectionStatus("Disconnected", "disconnected");
      sendButton.disabled = true;
    });

    socket.addEventListener("error", () => {
      updateConnectionStatus("Connection error", "disconnected");
    });

    messageForm.addEventListener("submit", event => {
      event.preventDefault();

      const message = messageInput.value.trim();

      if (!message || socket.readyState !== WebSocket.OPEN) {
        return;
      }

      socket.send(message);
      messageInput.value = "";
      messageInput.focus();
    });
  </script>
</body>
</html>

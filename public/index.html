
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sage &amp; Petal Chat</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">

    <style>
        :root {
            --sage: #8FA58A;
            --sage-dark: #536B50;
            --sage-light: #E7EDE2;
            --cream: #FAF8F0;
            --cream-dark: #F0EDE2;
            --white: #FFFFFF;
            --text: #465348;
            --muted: #899387;
            --border: #DCE4D6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 32px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--cream);
            background-image: radial-gradient(
                #DDE5D6 0.8px,
                transparent 0.8px
            );
            background-size: 22px 22px;
            color: var(--text);
            font-family: "Montserrat", Arial, sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .chat-card {
            position: relative;
            width: 100%;
            max-width: 820px;
            overflow: hidden;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: 0 15px 45px rgba(77, 96, 72, 0.12);
        }

        /* Decorative floral corners */
        .corner {
            position: absolute;
            z-index: 2;
            width: 82px;
            height: 82px;
            color: var(--sage);
            pointer-events: none;
            opacity: 0.8;
        }

        .corner svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .corner-top-left {
            top: 0;
            left: 0;
        }

        .corner-top-right {
            top: 0;
            right: 0;
            transform: scaleX(-1);
        }

        .header {
            position: relative;
            padding: 35px 80px 27px;
            text-align: center;
            background-color: var(--sage-light);
            border-bottom: 1px solid var(--border);
        }

        .character {
            display: flex;
            justify-content: center;
            margin-bottom: 8px;
        }

        .character svg {
            width: 94px;
            height: 100px;
            overflow: visible;
        }

        h1 {
            margin: 8px 0 10px;
            color: var(--sage-dark);
            font-family: "Pacifico", "Brush Script MT", cursive;
            font-size: clamp(30px, 5vw, 43px);
            font-weight: 400;
            line-height: 1.35;
        }

        .subtitle {
            max-width: 360px;
            margin: 0 auto;
            color: #6D7B6A;
            font-size: 12px;
            line-height: 1.8;
        }

        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 22px;
            background: #FFFDF8;
            border-bottom: 1px solid #EDF0E8;
        }

        .status-label {
            display: flex;
            align-items: center;
            gap: 9px;
            font-size: 11px;
            font-weight: 600;
            color: var(--muted);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            flex-shrink: 0;
            border-radius: 50%;
            background: #C5A16A;
        }

        #status.connected .status-dot {
            background: #79A879;
        }

        #status.disconnected .status-dot,
        #status.error .status-dot {
            background: #C77C75;
        }

        .status-note {
            color: #A0A698;
            font-size: 10px;
            text-align: right;
        }

        #log {
            height: 350px;
            overflow-y: auto;
            padding: 22px;
            background-color: #FFFEFA;
            scroll-behavior: smooth;
        }

        .empty-state {
            display: flex;
            min-height: 100%;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #A0AA99;
            font-size: 12px;
            line-height: 1.9;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 11px;
            margin: 14px 0;
            animation: appear 0.2s ease-out;
        }

        .avatar {
            display: flex;
            flex-shrink: 0;
            width: 37px;
            height: 37px;
            align-items: center;
            justify-content: center;
            border: 1px solid #DDE6D8;
            border-radius: 50%;
            background: #EDF2E8;
            font-size: 19px;
        }

        .bubble {
            max-width: 82%;
            padding: 12px 15px;
            overflow-wrap: anywhere;
            border: 1px solid #E5EADF;
            border-radius: 4px 16px 16px 16px;
            background: #F5F7F0;
            color: #4D5B4B;
            font-size: 12px;
            line-height: 1.8;
        }

        .message.system {
            justify-content: center;
            margin: 15px 0;
        }

        .message.system .bubble {
            max-width: 95%;
            padding: 8px 14px;
            border: 1px solid #E4E9DF;
            border-radius: 20px;
            background: #F7F7F0;
            color: #83907E;
            text-align: center;
            font-size: 10px;
        }

        .composer {
            padding: 17px 20px 14px;
            background: var(--white);
            border-top: 1px solid var(--border);
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #msgInput {
            min-width: 0;
            flex: 1;
            padding: 14px 17px;
            border: 1px solid #DCE4D6;
            border-radius: 12px;
            outline: none;
            background: #FCFCF8;
            color: var(--text);
            font-size: 12px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        #msgInput::placeholder {
            color: #A3AC9F;
        }

        #msgInput:focus {
            border-color: var(--sage);
            box-shadow: 0 0 0 3px rgba(143, 165, 138, 0.13);
        }

        #sendBtn {
            display: flex;
            flex-shrink: 0;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 13px 19px;
            border: 1px solid var(--sage);
            border-radius: 12px;
            background-color: var(--sage);
            color: white;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.2s;
        }

        #sendBtn:hover {
            background-color: var(--sage-dark);
            border-color: var(--sage-dark);
            transform: translateY(-1px);
        }

        #sendBtn:focus-visible {
            outline: 3px solid #CAD9C4;
            outline-offset: 3px;
        }

        .send-icon {
            width: 15px;
            height: 15px;
        }

        .footer {
            padding: 0 20px 17px;
            background: var(--white);
            color: #9BA493;
            text-align: center;
            font-size: 10px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 12px 8px;
            }

            .chat-card {
                border-radius: 19px;
            }

            .header {
                padding: 31px 38px 23px;
            }

            .corner {
                width: 58px;
                height: 58px;
            }

            .character svg {
                width: 78px;
                height: 84px;
            }

            #log {
                height: 340px;
                padding: 15px 12px;
            }

            .status-bar {
                padding: 12px 14px;
            }

            .status-note {
                max-width: 120px;
            }

            .composer {
                padding: 13px 12px 11px;
            }

            .controls {
                gap: 7px;
            }

            #msgInput {
                padding: 13px 11px;
            }

            #sendBtn {
                padding: 13px 12px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                scroll-behavior: auto !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>

<body>
    <main class="chat-card">

        <!-- Top-left floral decoration -->
        <div class="corner corner-top-left" aria-hidden="true">
            <svg viewBox="0 0 100 100" fill="none">
                <path d="M5 5 C25 15 23 35 42 43 C53 48 59 62 61 77"
                      stroke="currentColor" stroke-width="2"
                      stroke-linecap="round"/>
                <path d="M26 20 C12 9 9 26 26 32 C32 27 31 23 26 20Z"
                      fill="#B7C9AE"/>
                <path d="M40 42 C23 36 22 53 40 55 C46 50 45 45 40 42Z"
                      fill="#D7B6A4"/>
                <path d="M55 62 C40 50 35 68 52 73 C58 70 59 65 55 62Z"
                      fill="#B7C9AE"/>
                <circle cx="17" cy="15" r="5" fill="#D7B6A4"/>
                <circle cx="17" cy="8" r="4" fill="#D7B6A4"/>
                <circle cx="24" cy="12" r="4" fill="#D7B6A4"/>
                <circle cx="22" cy="20" r="4" fill="#D7B6A4"/>
                <circle cx="10" cy="20" r="4" fill="#D7B6A4"/>
                <circle cx="17" cy="15" r="2.5" fill="#E9D7A7"/>
            </svg>
        </div>

        <!-- Top-right floral decoration -->
        <div class="corner corner-top-right" aria-hidden="true">
            <svg viewBox="0 0 100 100" fill="none">
                <path d="M5 5 C25 15 23 35 42 43 C53 48 59 62 61 77"
                      stroke="currentColor" stroke-width="2"
                      stroke-linecap="round"/>
                <path d="M26 20 C12 9 9 26 26 32 C32 27 31 23 26 20Z"
                      fill="#B7C9AE"/>
                <path d="M40 42 C23 36 22 53 40 55 C46 50 45 45 40 42Z"
                      fill="#D7B6A4"/>
                <path d="M55 62 C40 50 35 68 52 73 C58 70 59 65 55 62Z"
                      fill="#B7C9AE"/>
                <circle cx="17" cy="15" r="5" fill="#D7B6A4"/>
                <circle cx="17" cy="8" r="4" fill="#D7B6A4"/>
                <circle cx="24" cy="12" r="4" fill="#D7B6A4"/>
                <circle cx="22" cy="20" r="4" fill="#D7B6A4"/>
                <circle cx="10" cy="20" r="4" fill="#D7B6A4"/>
                <circle cx="17" cy="15" r="2.5" fill="#E9D7A7"/>
            </svg>
        </div>

        <header class="header">
            <!-- Small original bunny illustration -->
            <div class="character" aria-hidden="true">
                <svg viewBox="0 0 120 125" fill="none">
                    <!-- Ears -->
                    <path d="M39 49 C26 23 30 5 42 9 C53 13 54 34 55 48Z"
                          fill="#F3E9D9" stroke="#8FA58A" stroke-width="2"/>
                    <path d="M40 35 C34 19 37 14 41 16 C47 20 48 32 49 39Z"
                          fill="#D9AFAE"/>
                    <path d="M68 48 C67 25 74 8 85 14 C96 20 84 43 77 52Z"
                          fill="#F3E9D9" stroke="#8FA58A" stroke-width="2"/>
                    <path d="M75 37 C78 22 83 20 86 23 C87 29 81 38 77 42Z"
                          fill="#D9AFAE"/>

                    <!-- Head -->
                    <ellipse cx="59" cy="62" rx="34" ry="29"
                             fill="#F3E9D9" stroke="#8FA58A" stroke-width="2"/>

                    <!-- Cheeks -->
                    <ellipse cx="42" cy="69" rx="7" ry="4"
                             fill="#E7C5BD"/>
                    <ellipse cx="76" cy="69" rx="7" ry="4"
                             fill="#E7C5BD"/>

                    <!-- Eyes and nose -->
                    <circle cx="47" cy="59" r="2.6" fill="#536B50"/>
                    <circle cx="71" cy="59" r="2.6" fill="#536B50"/>
                    <path d="M56 65 Q59 62 62 65 Q59 69 56 65Z"
                          fill="#B98283"/>
                    <path d="M59 68 V71 M59 71 Q55 75 52 71 M59 71 Q63 75 66 71"
                          stroke="#8C7770" stroke-width="1.4"
                          stroke-linecap="round"/>

                    <!-- Body -->
                    <ellipse cx="60" cy="100" rx="23" ry="19"
                             fill="#DDE7D5" stroke="#8FA58A" stroke-width="2"/>
                    <ellipse cx="60" cy="103" rx="11" ry="12"
                             fill="#F7F3E9"/>

                    <!-- Small scarf -->
                    <path d="M42 86 Q60 96 78 86 L74 94 Q60 101 46 94Z"
                          fill="#B8C8AD"/>
                    <path d="M69 94 L76 106 L67 103Z"
                          fill="#B8C8AD" stroke="#8FA58A"
                          stroke-width="1.3"/>

                    <!-- Tiny flower detail -->
                    <circle cx="83" cy="83" r="4" fill="#D9AFAE"/>
                    <circle cx="78" cy="81" r="4" fill="#D9AFAE"/>
                    <circle cx="80" cy="76" r="4" fill="#D9AFAE"/>
                    <circle cx="85" cy="77" r="4" fill="#D9AFAE"/>
                    <circle cx="85" cy="82" r="2" fill="#E9D7A7"/>
                </svg>
            </div>

            <h1>Sage &amp; Petal</h1>
            <p class="subtitle">
                A little space to share your thoughts and connect with others.
            </p>
        </header>

        <div class="status-bar">
            <div class="status-label" id="status" role="status" aria-live="polite">
                <span class="status-dot"></span>
                <span id="statusText">Connecting to server...</span>
            </div>
            <div class="status-note">Your little corner of the internet</div>
        </div>

        <div id="log" aria-live="polite" aria-label="Chat messages">
            <div class="empty-state" id="emptyState">
                <div>
                    <div>Welcome to Sage &amp; Petal</div>
                    <div>Messages will appear here when you start chatting.</div>
                </div>
            </div>
        </div>

        <form class="composer" id="chatForm">
            <div class="controls">
                <input
                    type="text"
                    id="msgInput"
                    placeholder="Write a message..."
                    maxlength="500"
                    autocomplete="off"
                    aria-label="Your message"
                >

                <button id="sendBtn" type="submit">
                    <svg class="send-icon" viewBox="0 0 24 24"
                         fill="none" aria-hidden="true">
                        <path d="M21 3 L10.5 13.5"
                              stroke="currentColor" stroke-width="2"
                              stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M21 3 L14.5 21 L10.5 13.5 L3 9.5 L21 3Z"
                              stroke="currentColor" stroke-width="2"
                              stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Send
                </button>
            </div>
        </form>

        <footer class="footer">
            A calm little place to connect.
        </footer>
    </main>

    <script>
        // Codespaces-compatible WebSocket URL.
        // Uses secure WebSockets automatically when the page uses HTTPS.
        const wsUrl =
            (location.protocol === "https:" ? "wss://" : "ws://") +
            location.host;

        const socket = new WebSocket(wsUrl);

        const status = document.getElementById("status");
        const statusText = document.getElementById("statusText");
        const log = document.getElementById("log");
        const msgInput = document.getElementById("msgInput");
        const sendBtn = document.getElementById("sendBtn");
        const chatForm = document.getElementById("chatForm");
        const emptyState = document.getElementById("emptyState");

        const avatars = ["🐰", "🐻", "🐱", "🦊", "🐼", "🐸"];

        function addMessage(message) {
            const text = String(message);

            // Remove the welcome placeholder when the first message appears.
            if (emptyState && emptyState.parentNode) {
                emptyState.remove();
            }

            const entry = document.createElement("div");
            entry.className = "message";

            const isSystemMessage =
                text.startsWith("Connected") ||
                text.startsWith("Connection") ||
                text.startsWith("Unable") ||
                text.startsWith("Cannot send") ||
                text.startsWith("Welcome");

            if (isSystemMessage) {
                entry.classList.add("system");

                const bubble = document.createElement("div");
                bubble.className = "bubble";
                bubble.textContent = text;

                entry.appendChild(bubble);
            } else {
                const avatar = document.createElement("div");
                avatar.className = "avatar";
                avatar.setAttribute("aria-hidden", "true");

                // Choose a consistent avatar based on the message text.
                let hash = 0;

                for (let i = 0; i < text.length; i++) {
                    hash = (hash + text.charCodeAt(i)) % 997;
                }

                avatar.textContent = avatars[hash % avatars.length];

                const bubble = document.createElement("div");
                bubble.className = "bubble";

                // textContent safely displays messages as text.
                bubble.textContent = text;

                entry.appendChild(avatar);
                entry.appendChild(bubble);
            }

            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        socket.onopen = function () {
            status.className = "status-label connected";
            statusText.textContent = "Connected and ready to chat";
            addMessage("Welcome to Sage & Petal!");
        };

        socket.onmessage = function (event) {
            addMessage(event.data);
        };

        socket.onclose = function () {
            status.className = "status-label disconnected";
            statusText.textContent = "Disconnected from server";
            addMessage("Connection closed. Refresh the page to reconnect.");
        };

        socket.onerror = function () {
            status.className = "status-label error";
            statusText.textContent = "Connection error";
            addMessage("Unable to connect to the server.");
        };

        function sendMessage() {
            const message = msgInput.value.trim();

            if (message === "") {
                return;
            }

            if (socket.readyState === WebSocket.OPEN) {
                // Keep the existing plain-text protocol for app.bzg.
                socket.send(message);
                msgInput.value = "";
                msgInput.focus();
            } else {
                addMessage("Cannot send: WebSocket is not connected.");
            }
        }

        chatForm.addEventListener("submit", function (event) {
            event.preventDefault();
            sendMessage();
        });
    </script>
</body>
</html>

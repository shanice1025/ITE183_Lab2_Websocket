
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Little Cozy Chat ♡</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Trebuchet MS", Arial, sans-serif;
            background: linear-gradient(135deg, #fce4ec, #eee5ff, #e3f5ff);
            color: #55445f;
        }

        .chat-card {
            width: 100%;
            max-width: 760px;
            overflow: hidden;
            border: 3px solid white;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.92);
            box-shadow: 0 18px 50px rgba(126, 91, 153, 0.16);
        }

        .header {
            padding: 26px 24px;
            text-align: center;
            background: linear-gradient(120deg, #f8cfe0, #ded0ff);
        }

        .header .decor {
            font-size: 25px;
            letter-spacing: 8px;
        }

        h1 {
            margin: 8px 0;
            color: #684b7d;
            font-size: clamp(25px, 5vw, 35px);
        }

        .subtitle {
            margin: 0;
            color: #765d82;
            font-size: 14px;
        }

        .status-wrap {
            padding: 12px 20px;
            background: #fff9fd;
            border-bottom: 1px solid #f2e5f6;
        }

        #status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 13px;
            border-radius: 20px;
            background: #f1eaff;
            color: #75548c;
            font-size: 12px;
            font-weight: bold;
        }

        #status::before {
            content: "●";
            color: #e8a6c8;
        }

        #status.connected::before {
            color: #72bd94;
        }

        #status.disconnected::before,
        #status.error::before {
            color: #e78391;
        }

        #log {
            height: 350px;
            overflow-y: auto;
            padding: 22px;
            background-color: #fffbff;
            background-image: radial-gradient(#f0e1f6 1px, transparent 1px);
            background-size: 20px 20px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 13px 0;
            animation: appear 0.2s ease-out;
        }

        .avatar {
            flex-shrink: 0;
            display: grid;
            place-items: center;
            width: 39px;
            height: 39px;
            border: 2px solid white;
            border-radius: 50%;
            background: #f8d7e8;
            font-size: 21px;
            box-shadow: 0 2px 7px #e9dcec;
        }

        .bubble {
            max-width: 82%;
            padding: 11px 15px;
            border: 1px solid #f1e0f5;
            border-radius: 5px 18px 18px 18px;
            background: white;
            overflow-wrap: anywhere;
            line-height: 1.5;
            font-size: 14px;
        }

        .message.system {
            justify-content: center;
        }

        .message.system .bubble {
            max-width: 95%;
            border: none;
            border-radius: 20px;
            background: #f1eaff;
            color: #806894;
            text-align: center;
            font-size: 12px;
        }

        .controls {
            display: flex;
            gap: 10px;
            padding: 18px;
            border-top: 1px solid #f2e5f6;
            background: white;
        }

        #msgInput {
            min-width: 0;
            flex: 1;
            padding: 14px 17px;
            border: 2px solid #eadcf5;
            border-radius: 22px;
            outline: none;
            background: #fffbff;
            color: #55445f;
            font: inherit;
        }

        #msgInput:focus {
            border-color: #c7a7e8;
        }

        #sendBtn {
            padding: 12px 22px;
            border: none;
            border-radius: 22px;
            background: linear-gradient(120deg, #eebbd6, #cbb5f5);
            color: #594269;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 12px #eadcf5;
        }

        .footer {
            padding: 0 15px 17px;
            color: #a18eab;
            background: white;
            text-align: center;
            font-size: 11px;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 8px;
            }

            #log {
                height: 320px;
                padding: 15px 10px;
            }

            .controls {
                padding: 12px;
            }

            #sendBtn {
                padding: 12px 16px;
            }
        }
    </style>
</head>

<body>
    <main class="chat-card">
        <header class="header">
            <div class="decor">୨୧ ♡ ✧</div>
            <h1>Little Cozy Chat</h1>
            <p class="subtitle">a little place to talk and make friends ♡</p>
        </header>

        <div class="status-wrap">
            <div id="status">Connecting to server...</div>
        </div>

        <div id="log" aria-live="polite"></div>

        <div class="controls">
            <input
                type="text"
                id="msgInput"
                placeholder="Write a little message..."
                maxlength="500"
                autocomplete="off"
                aria-label="Your message"
            >
            <button id="sendBtn" type="button">Send ♡</button>
        </div>

        <div class="footer">made with ♡ and a little bit of magic</div>
    </main>

    <script>
        const wsUrl =
            (location.protocol === "https:" ? "wss://" : "ws://") +
            location.host;

        const socket = new WebSocket(wsUrl);

        const status = document.getElementById("status");
        const log = document.getElementById("log");
        const msgInput = document.getElementById("msgInput");
        const sendBtn = document.getElementById("sendBtn");

        const avatars = ["🐰", "🐱", "🐻", "🐼", "🐸", "🦊"];

        function addMessage(message) {
            const text = String(message);

            const entry = document.createElement("div");
            entry.className = "message";

            if (
                text.startsWith("Connected") ||
                text.startsWith("Connection") ||
                text.startsWith("Unable") ||
                text.startsWith("Cannot send") ||
                text.startsWith("Welcome")
            ) {
                entry.classList.add("system");

                const bubble = document.createElement("div");
                bubble.className = "bubble";
                bubble.textContent = text;

                entry.appendChild(bubble);
            } else {
                const avatar = document.createElement("div");
                avatar.className = "avatar";

                let characterIndex = 0;
                let hash = 0;

                for (let i = 0; i < text.length; i++) {
                    hash = (hash + text.charCodeAt(i)) % 997;
                }

                characterIndex = hash % avatars.length;
                avatar.textContent = avatars[characterIndex];
                avatar.setAttribute("aria-hidden", "true");

                const bubble = document.createElement("div");
                bubble.className = "bubble";
                bubble.textContent = text;

                entry.appendChild(avatar);
                entry.appendChild(bubble);
            }

            log.appendChild(entry);
            log.scrollTop = log.scrollHeight;
        }

        socket.onopen = function () {
            status.textContent = "Connected and ready to chat!";
            status.className = "connected";
            addMessage("Welcome to Little Cozy Chat! ♡");
        };

        socket.onmessage = function (event) {
            addMessage(event.data);
        };

        socket.onclose = function () {
            status.textContent = "Disconnected from server";
            status.className = "disconnected";
            addMessage("Connection closed. Please reconnect to chat.");
        };

        socket.onerror = function () {
            status.textContent = "Connection error";
            status.className = "error";
            addMessage("Unable to connect to the server.");
        };

        function sendMessage() {
            const message = msgInput.value.trim();

            if (message === "") {
                return;
            }

            if (socket.readyState === WebSocket.OPEN) {
                socket.send(message);
                msgInput.value = "";
                msgInput.focus();
            } else {
                addMessage("Cannot send: WebSocket is not connected.");
            }
        }

        sendBtn.addEventListener("click", sendMessage);

        msgInput.addEventListener("keydown", function (event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        });
    </script>
</body>
</html>
